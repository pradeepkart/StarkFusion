spring.application.name=skill-gap-analyzer
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skill_gap_analyzer?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
jwt.secret=${JWT_SECRET:your-development-secret-key-that-is-long-enough}
jwt.expiration=86400000
app.admin.enabled=${ADMIN_ENABLED:true}
app.admin.name=${ADMIN_NAME:Admin}
app.admin.email=${ADMIN_EMAIL:admin@skillgap.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
